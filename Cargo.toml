[workspace]
resolver = "2"
members = [
  "apps/renrencodex-connect",
  "crates/client-native",
  "crates/client-protocol",
  "apps/desktop/src-tauri",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.0.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "=2.11.5"
tauri-build = "=2.6.3"
tauri-plugin-deep-link = "=2.4.10"
tauri-plugin-clipboard-manager = "=2.3.2"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-single-instance = { version = "=2.4.4", features = ["deep-link"] }
tauri-plugin-updater = "=2.12.0"
url = "2"

[profile.agent-release]
inherits = "release"
codegen-units = 1
lto = "thin"
overflow-checks = true
panic = "abort"
strip = "symbols"
