name: Desktop Updater Packages
run-name: Desktop Updater Packages · main

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Public update notes
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-updater-packages-main
  cancel-in-progress: false

jobs:
  resolve_source:
    name: Resolve updater source
    environment: desktop-updater-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit_sha: ${{ steps.source.outputs.commit_sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Check out current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Verify public snapshot gate
        run: bun scripts/sync-from-upstream.ts --public-ready

      - name: Require explicit updater build enablement
        env:
          ENABLE_DESKTOP_UPDATER_BUILD: ${{ vars.ENABLE_DESKTOP_UPDATER_BUILD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ENABLE_DESKTOP_UPDATER_BUILD" == "true" ]]

      - id: source
        name: Pin source and version
        shell: bash
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ "$commit_sha" == "$remote_main" ]]
          version="$(bun -e 'const value = (await Bun.file("apps/desktop/package.json").json()).version; if (typeof value !== "string") process.exit(1); console.log(value)')"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building updater-signed Desktop $version from \`$commit_sha\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Require a monotonically newer public version
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          bun -e 'import { assertNewerThanPublishedDesktopRelease } from "./scripts/validate-release"; await assertNewerThanPublishedDesktopRelease(process.env.RELEASE_VERSION ?? "")'

      - name: Require successful CI for the exact source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SOURCE_SHA}&event=push&per_page=100")"
          jq -e 'any(.workflow_runs[]; .name == "CI" and .head_sha == $sha and .status == "completed" and .conclusion == "success")' \
            --arg sha "$SOURCE_SHA" <<<"$response" >/dev/null

      - name: Verify updater signing material
        env:
          RENRENCODEX_UPDATER_PUBLIC_KEY: ${{ secrets.RENRENCODEX_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]]
          [[ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]]
          [[ -n "$RENRENCODEX_UPDATER_PUBLIC_KEY" ]]
          temporary_directory="$(mktemp -d "$RUNNER_TEMP/updater-preflight.XXXXXX")"
          trap 'rm -rf "$temporary_directory"' EXIT
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | base64 --decode > "$temporary_directory/updater.key"
          printf '%s' "$RENRENCODEX_UPDATER_PUBLIC_KEY" | base64 --decode > "$temporary_directory/updater.key.pub"
          grep -Fq 'untrusted comment: rsign encrypted secret key' "$temporary_directory/updater.key"
          grep -Fq 'untrusted comment: minisign public key:' "$temporary_directory/updater.key.pub"

  windows:
    name: Build updater-signed Windows x64
    needs: resolve_source
    environment: desktop-updater-release
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VITE_API_BASE_URL: https://renrencodex.com
      VITE_WEB_BASE_URL: https://renrencodex.com
      VITE_GATEWAY_WS_URL: wss://renrencodex.com/gateway
    steps:
      - name: Check out pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve_source.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Verify snapshot and install dependencies
        shell: pwsh
        run: |
          bun scripts/sync-from-upstream.ts --public-ready
          if ($LASTEXITCODE -ne 0) { throw "public snapshot gate failed" }
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw "dependency installation failed" }
          bun run --cwd apps/desktop typecheck
          if ($LASTEXITCODE -ne 0) { throw "Desktop typecheck failed" }

      - name: Build MSI with updater signature
        env:
          RELEASE_VERSION: ${{ needs.resolve_source.outputs.version }}
          RENRENCODEX_UPDATER_PUBLIC_KEY: ${{ secrets.RENRENCODEX_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $configPath = Join-Path $env:RUNNER_TEMP "tauri.updater.conf.json"
          @{
            bundle = @{ createUpdaterArtifacts = $true }
            plugins = @{ updater = @{ pubkey = $env:RENRENCODEX_UPDATER_PUBLIC_KEY.Trim() } }
          } | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 $configPath
          bun run --cwd apps/desktop tauri build --ci --bundles msi --config $configPath
          if ($LASTEXITCODE -ne 0) { throw "Windows updater build failed" }

          $msi = @(Get-ChildItem "target/release/bundle/msi/*.msi")
          if ($msi.Count -ne 1) { throw "expected exactly one MSI" }
          $signature = Get-Item "$($msi[0].FullName).sig"
          if ($signature.Length -eq 0) { throw "MSI updater signature is empty" }
          $authenticode = Get-AuthenticodeSignature $msi[0].FullName
          if ($authenticode.Status -eq "Valid") {
            throw "certificate-free updater build unexpectedly has a trusted Authenticode signature"
          }

          $output = "target/desktop-updater-artifact"
          New-Item -ItemType Directory -Force $output | Out-Null
          Copy-Item $msi[0].FullName "$output/renrencodex-desktop-$env:RELEASE_VERSION-x64.msi"
          Copy-Item $signature.FullName "$output/renrencodex-desktop-$env:RELEASE_VERSION-x64.msi.sig"

      - name: Upload Windows updater package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: updater-windows-${{ needs.resolve_source.outputs.commit_sha }}
          path: target/desktop-updater-artifact/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Build updater-signed macOS Universal
    needs: resolve_source
    environment: desktop-updater-release
    runs-on: macos-15
    timeout-minutes: 90
    env:
      APPLE_SIGNING_IDENTITY: "-"
      VITE_API_BASE_URL: https://renrencodex.com
      VITE_WEB_BASE_URL: https://renrencodex.com
      VITE_GATEWAY_WS_URL: wss://renrencodex.com/gateway
    steps:
      - name: Check out pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve_source.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Verify snapshot and install dependencies
        run: |
          set -euo pipefail
          bun scripts/sync-from-upstream.ts --public-ready
          bun install --frozen-lockfile
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          bun run --cwd apps/desktop typecheck

      - name: Build Universal app, DMG, and updater archive
        env:
          RELEASE_VERSION: ${{ needs.resolve_source.outputs.version }}
          RENRENCODEX_UPDATER_PUBLIC_KEY: ${{ secrets.RENRENCODEX_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          config_path="$RUNNER_TEMP/tauri.updater.conf.json"
          bun -e 'await Bun.write(process.argv[1], JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.RENRENCODEX_UPDATER_PUBLIC_KEY?.trim()}}}, null, 2))' "$config_path"
          bun run --cwd apps/desktop tauri build --ci \
            --target universal-apple-darwin --bundles app,dmg --config "$config_path"

          bundle_root="target/universal-apple-darwin/release/bundle"
          shopt -s nullglob
          apps=("$bundle_root/macos/"*.app)
          dmgs=("$bundle_root/dmg/"*.dmg)
          updaters=("$bundle_root/macos/"*.app.tar.gz)
          if [[ "${#apps[@]}" != 1 || "${#dmgs[@]}" != 1 || "${#updaters[@]}" != 1 ]]; then
            echo "unexpected macOS artifact count" >&2
            exit 1
          fi
          app_path="${apps[0]}"
          updater_path="${updaters[0]}"
          test -s "$updater_path.sig"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --display --verbose=4 "$app_path" 2>&1 | grep -Fq 'Signature=adhoc'
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
          architectures="$(lipo -archs "$app_path/Contents/MacOS/$executable_name")"
          [[ " $architectures " == *" arm64 "* && " $architectures " == *" x86_64 "* ]]
          hdiutil verify "${dmgs[0]}"

          output="target/desktop-updater-artifact"
          mkdir "$output"
          cp "${dmgs[0]}" "$output/renrencodex-desktop-$RELEASE_VERSION-universal.dmg"
          cp "$updater_path" "$output/renrencodex-desktop-$RELEASE_VERSION-universal.app.tar.gz"
          cp "$updater_path.sig" "$output/renrencodex-desktop-$RELEASE_VERSION-universal.app.tar.gz.sig"

      - name: Upload macOS updater package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: updater-macos-${{ needs.resolve_source.outputs.commit_sha }}
          path: target/desktop-updater-artifact/*
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Build updater-signed Linux x64
    needs: resolve_source
    environment: desktop-updater-release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VITE_API_BASE_URL: https://renrencodex.com
      VITE_WEB_BASE_URL: https://renrencodex.com
      VITE_GATEWAY_WS_URL: wss://renrencodex.com/gateway
    steps:
      - name: Check out pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve_source.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Install build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev
          build-essential
          curl
          wget
          file
          libxdo-dev
          libssl-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf
          rpm

      - name: Verify snapshot and install dependencies
        run: |
          set -euo pipefail
          bun scripts/sync-from-upstream.ts --public-ready
          bun install --frozen-lockfile
          rustup default stable
          bun run --cwd apps/desktop typecheck

      - name: Build AppImage, DEB, RPM, and updater signature
        env:
          RELEASE_VERSION: ${{ needs.resolve_source.outputs.version }}
          RENRENCODEX_UPDATER_PUBLIC_KEY: ${{ secrets.RENRENCODEX_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          config_path="$RUNNER_TEMP/tauri.updater.conf.json"
          bun -e 'await Bun.write(process.argv[1], JSON.stringify({productName:"RenrenCodex",bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.RENRENCODEX_UPDATER_PUBLIC_KEY?.trim()}}}, null, 2))' "$config_path"
          bun run --cwd apps/desktop tauri build --ci \
            --bundles deb,rpm,appimage --config "$config_path"

          shopt -s nullglob
          appimages=(target/release/bundle/appimage/*.AppImage)
          debs=(target/release/bundle/deb/*.deb)
          rpms=(target/release/bundle/rpm/*.rpm)
          if [[ "${#appimages[@]}" != 1 || "${#debs[@]}" != 1 || "${#rpms[@]}" != 1 ]]; then
            echo "unexpected Linux artifact count" >&2
            exit 1
          fi
          test -s "${appimages[0]}.sig"
          output="target/desktop-updater-artifact"
          mkdir "$output"
          cp "${appimages[0]}" "$output/renrencodex-desktop-$RELEASE_VERSION-x86_64.AppImage"
          cp "${appimages[0]}.sig" "$output/renrencodex-desktop-$RELEASE_VERSION-x86_64.AppImage.sig"
          cp "${debs[0]}" "$output/renrencodex-desktop-$RELEASE_VERSION-x86_64.deb"
          cp "${rpms[0]}" "$output/renrencodex-desktop-$RELEASE_VERSION-x86_64.rpm"

      - name: Upload Linux updater package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: updater-linux-${{ needs.resolve_source.outputs.commit_sha }}
          path: target/desktop-updater-artifact/*
          if-no-files-found: error
          retention-days: 14

  prepare:
    name: Verify and prepare website release
    needs: [resolve_source, windows, macos, linux]
    environment: desktop-updater-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ needs.resolve_source.outputs.version }}
    steps:
      - name: Check out pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve_source.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Download platform artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: updater-*-${{ needs.resolve_source.outputs.commit_sha }}
          path: target/desktop-updater-input
          merge-multiple: true

      - name: Verify updater signatures and prepare source tree
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RENRENCODEX_UPDATER_PUBLIC_KEY: ${{ secrets.RENRENCODEX_UPDATER_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y minisign=0.11-1
          public_key="$RUNNER_TEMP/updater.pub"
          notes_file="$RUNNER_TEMP/release-notes.txt"
          printf '%s' "$RENRENCODEX_UPDATER_PUBLIC_KEY" | base64 --decode > "$public_key"
          printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
          grep -Fq 'untrusted comment: minisign public key:' "$public_key"

          verify_updater() {
            local artifact="$1"
            local encoded_signature="$artifact.sig"
            local signature
            signature="$RUNNER_TEMP/$(basename "$encoded_signature").minisig"
            test -s "$artifact"
            test -s "$encoded_signature"
            base64 --decode "$encoded_signature" > "$signature"
            minisign -Vm "$artifact" -x "$signature" -p "$public_key"
            grep -Fq "version:$RELEASE_VERSION" "$signature"
          }
          verify_updater "target/desktop-updater-input/renrencodex-desktop-$RELEASE_VERSION-x64.msi"
          verify_updater "target/desktop-updater-input/renrencodex-desktop-$RELEASE_VERSION-universal.app.tar.gz"
          verify_updater "target/desktop-updater-input/renrencodex-desktop-$RELEASE_VERSION-x86_64.AppImage"

          bun run --cwd apps/desktop release:prepare-all -- \
            --input-dir target/desktop-updater-input \
            --notes-file "$notes_file" \
            --output-dir target/desktop-updater-release
          (cd target/desktop-updater-release/downloads && sha256sum -c ../SHA256SUMS)

      - name: Upload prepared website release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: renrencodex-desktop-website-${{ needs.resolve_source.outputs.version }}-${{ needs.resolve_source.outputs.commit_sha }}
          path: target/desktop-updater-release/*
          if-no-files-found: error
          retention-days: 14
